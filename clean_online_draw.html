<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clean Online Draw</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--accent:#38bdf8;--muted:#9ca3af;}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:white;padding:24px;}
    .box{max-width:800px;margin:auto;background:var(--card);padding:24px;border-radius:12px;}
    h1{text-align:center;margin:0 0 20px;}
    textarea{width:100%;height:300px;border-radius:8px;padding:10px;background:#1f2937;color:white;border:1px solid #334155;}
    button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;}
    .run{background:var(--accent);color:black;}
    .secondary{background:#334155;color:white;}
    #current{font-size:32px;text-align:center;margin:20px 0;}
    #winners{margin-top:15px;padding:12px;background:#1e2533;border-radius:8px;max-height:250px;overflow:auto;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Online Draw</h1>
    <textarea id="names">ARANETA
LISING
ABLOLA
ALDEA
ANTONIO
ΒΕΝJAΜΙΝ
CALIWARA
CARATING
DEMILLO
DUMLAO
ECULLADA
GALANG
GALVEZ
LANDINGIN
LIMPIN
LOTA
LUSTADO
MANOS
MENDOZA
MONTENEGRO
NARVAEZ
NUQUI
PALISOC
GARBO
LIMATEN
FAT
ALFONSO
DONIZA
HILVANO
SERRANO
QUINIMON
VALENCIA
COLOMA</textarea>

    <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
      <button id="pick" class="run">Pick</button>
      <button id="reset" class="secondary">Reset</button>
    </div>

    <div id="current">—</div>
    <div id="winners"></div>
  </div>

  <script>
    function parseNames(text){
      return text.split('\n').map(s=>s.trim()).filter(Boolean);
    }

    let winners = [];
    let pool = parseNames(document.getElementById("names").value);

    function renderWinners(){
      const box = document.getElementById("winners");
      box.innerHTML = winners.map((w,i)=>`${i+1}. ${w}`).join('<br>');
    }

    document.getElementById("pick").onclick = ()=>{
      if(pool.length === 0){ alert("No more names."); return; }
      const i = Math.floor(Math.random()*pool.length);
      const name = pool.splice(i,1)[0];
      winners.push(name);
      document.getElementById("current").textContent = name;
      renderWinners();
    };

    document.getElementById("reset").onclick = ()=>{
      winners = [];
      pool = parseNames(document.getElementById("names").value);
      document.getElementById("current").textContent = "—";
      renderWinners();
    };
  </script>
</body>
</html>
